media(max-width:560px){.nav{height:64px}.brand{font-size:18px}.hero{padding:88px 0 30px}.grid{grid-template-columns:1fr;padding-bottom:55px}.nav .wrap>div{gap:5px!important}.wa-top,.loc-top,.back{padding:9px 10px;font-size:11px}.wa-top{font-size:0}.wa-top:first-letter{font-size:15px}.loc-top{font-size:0}.loc-top:first-letter{font-size:15px}.back{font-size:11px}}

.offers-floating-cart{position:fixed;right:22px;bottom:22px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#15100c,#6e4a18);border:1px solid rgba(184,138,50,.5);color:#fff;display:grid;place-items:center;font-size:25px;z-index:9999;box-shadow:0 14px 35px rgba(0,0,0,.24)}.offers-floating-cart span{position:absolute;right:-2px;top:-5px;min-width:21px;height:21px;padding:0 5px;border-radius:999px;background:#b88a32;color:#fff;font:700 11px Arial;display:grid;place-items:center}.offers-floating-cart.pulse{animation:offerPulse .45s ease}@keyframes offerPulse{50%{transform:scale(1.12)}}.btn.added{background:#2d7a4a!important}.btn-row .btn{width:100%;min-width:0}.btn-row{display:block}.hero .back{background:#fff8ed;border-color:#d7bb87}.view-all-offers{display:inline-flex!important;align-items:center;justify-content:center;padding:14px 22px!important;border:1px solid #b88a32!important;background:linear-gradient(135deg,#fff,#fff8ed)!important;color:#6d1830!important;box-shadow:0 10px 24px rgba(176,138,72,.15);font-weight:700!important;letter-spacing:.02em}.view-all-offers:after{content:'  ✦';color:#b88a32}@media(max-width:560px){.offers-floating-cart{right:16px;bottom:16px;width:56px;height:56px}.grid{padding-top:10px}.hero{padding:78px 0 28px}.hero h1{font-size:52px;line-height:.9}.hero p{font-size:13px;padding:0 12px}.card{border-radius:18px}.card img{aspect-ratio:1/1}.body{padding:14px}.body h2{font-size:25px}.price{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}.price s{order:2;margin-right:0;font-size:12px}.price strong{font-size:20px}.btn-row .btn{min-height:46px;font-size:12px}.nav .wrap{width:94%!important}.brand{font-size:17px}.wa-top,.loc-top{font-size:0!important;width:38px;height:38px;padding:0;display:grid;place-items:center}.wa-top:first-letter,.loc-top:first-letter{font-size:16px}.back{font-size:0;padding:0;width:38px;height:38px;display:grid;place-items:center}.back:first-letter{font-size:18px}}</style></head><body><header class="nav"><div class="wrap" style="display:flex;align-items:center;justify-content:space-between;width:min(1180px,92%)"><a class="brand" href="index.html">HARSHIYAAN COLLECTIONS</a><div style="display:flex;gap:8px;align-items:center"><a class="wa-top" href="https://wa.me/919703322305" target="_blank" rel="noopener">💬 WhatsApp</a><a class="loc-top" href="https://www.google.com/maps/search/?api=1&query=Harshiyaan%20Collection%2C%203%20Cross%2C%20SBI%20Colony%2C%20Madanapalle%2C%20Andhra%20Pradesh%20517325" target="_blank" rel="noopener">⌖ Location</a><a class="back" href="index.html">← Back</a></div></div></header><a id="offersFloatingCart" class="offers-floating-cart" href="index.html?openCart=1" aria-label="Open shopping cart" title="Open Cart">🛒<span id="offersCartBadge">0</span></a><main class="wrap"><section class="hero"><div class="eyebrow">HARSHIYAAN COLLECTIONS</div><h1>Special Offers</h1><p>Current offers and featured deals managed from the Harshiyaan admin dashboard.</p></section><section id="offerGrid" class="grid"></section></main><script>
(function(){
  function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
  function getCart(){try{return JSON.parse(localStorage.getItem('hc_cart')||'[]')}catch(e){return []}}
  function cartCount(){return getCart().reduce((a,x)=>a+(Number(x.qty)||0),0)}
  function updateCartBadge(){var b=document.getElementById('offersCartBadge');if(b)b.textContent=cartCount()}
  function addOfferToCart(id,button){
    var cart=getCart();
    var item=cart.find(function(x){return String(x.id)===String(id)});
    if(item)item.qty=(Number(item.qty)||0)+1; else cart.push({id:id,qty:1});
    localStorage.setItem('hc_cart',JSON.stringify(cart));
    updateCartBadge();
    if(button){button.innerHTML='✓ Added to Cart';button.classList.remove('gold');button.classList.add('added');}
    var icon=document.getElementById('offersFloatingCart');
    if(icon){icon.classList.remove('pulse');void icon.offsetWidth;icon.classList.add('pulse');}
    setTimeout(function(){if(button){button.innerHTML='🛒 Add to Cart';button.classList.add('gold');button.classList.remove('added');}},1400);
  }
  window.addOfferToCart=addOfferToCart;
  function render(){
    var products=[],offers=[];
    try{products=JSON.parse(localStorage.getItem('hc_products')||'[]');offers=JSON.parse(localStorage.getItem('hc_offers')||'[]')}catch(e){}
    var active=offers.filter(function(o){return o.active}).map(function(o){var p=products.find(function(x){return Number(x.id)===Number(o.productId)});return p?Object.assign({},p,{title:o.title,text:o.text,old:o.old||p.old,price:o.price||p.price}):null}).filter(Boolean);
    var fallback=products.filter(function(p){return Number(p.old)>Number(p.price)});
    var list=active.length?active:fallback;
    var grid=document.getElementById('offerGrid');
    grid.innerHTML=list.length?list.map(function(p){
      var safeId=String(p.id).replace(/[^0-9A-Za-z_-]/g,'');
      return '<article class="card"><img src="'+p.img+'" alt="'+String(p.name).replace(/"/g,'&quot;')+'" onerror="this.onerror=null;this.src=\'products/product1.png\'">'+
      '<div class="body"><h2>'+p.name+'</h2><div class="price"><s>'+money(p.old)+'</s><strong>'+money(p.price)+'</strong></div><div class="meta">Product ID: <b>'+p.id+'</b>'+(p.discount?' · '+p.discount+'% OFF':'')+'</div><p class="msg">'+(p.text||'Limited-time jewellery offer.')+'</p><div class="btn-row"><button class="btn gold" type="button" data-offer-cart="'+safeId+'">🛒 Add to Cart</button></div></div></article>'
    }).join(''):'<div class="empty">No active offers right now. Please check again soon.</div>';
    grid.querySelectorAll('[data-offer-cart]').forEach(function(btn){btn.addEventListener('click',function(){addOfferToCart(btn.getAttribute('data-offer-cart'),btn)})});
    updateCartBadge();
  }
  document.addEventListener('DOMContentLoaded',render);
})();
</script></body></html>
