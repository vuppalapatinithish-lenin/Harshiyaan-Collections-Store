<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Special Offers — Harshiyaan Collections</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--ink:#241b26;--gold:#b08a48;--muted:#756b78}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff 0%,#faf7ff 48%,#eadcff 100%)}a{text-decoration:none;color:inherit}.wrap{width:min(1180px,92%);margin:auto}.nav{height:76px;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee}.brand{font-family:'Cormorant Garamond';font-size:25px;letter-spacing:.12em;color:#6d1830}.back,.wa-top,.loc-top{border:1px solid #ddd;padding:10px 14px;border-radius:999px;white-space:nowrap}.wa-top{color:#1f6b38;border-color:#b9d9c2}.loc-top{color:#6d1830}.hero{padding:105px 0 34px;text-align:center}.view-offers-btn{display:inline-flex;align-items:center;gap:10px;margin-top:20px;padding:15px 28px;border-radius:999px;background:linear-gradient(135deg,#2a1c2d,#5c3047);color:#fff;box-shadow:0 12px 28px rgba(55,25,45,.18);font-weight:700;border:1px solid rgba(184,138,50,.55)}.view-offers-btn:hover{transform:translateY(-1px)}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--gold);font-weight:700}.hero h1{font:600 clamp(52px,7vw,92px)/.86 'Cormorant Garamond';margin:14px 0}.hero p{color:var(--muted);max-width:600px;margin:auto;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:25px 0 90px}.card{background:#fff;border:1px solid #eadff2;border-radius:22px;overflow:hidden;box-shadow:0 18px 50px rgba(60,35,80,.09)}.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#f7f1e8;display:block}.body{padding:20px}.body h2{font:600 29px/1 'Cormorant Garamond';margin:0 0 8px}.price s{color:#999;margin-right:8px}.price strong{font-size:21px}.meta{font-size:11px;color:#786d79;margin-top:8px}.msg{font-size:13px;color:#6e6470;line-height:1.6;margin:12px 0}.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:999px;background:#251b29;color:#fff;margin-top:8px;border:0;cursor:pointer;font:600 13px/1 DM Sans,sans-serif}.btn.gold{background:#b88a32}.btn-row{display:flex;gap:8px;flex-wrap:wrap}.btn-row .btn{flex:1;min-width:130px}.empty{padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}.hc-floating-cart{position:fixed;right:20px;bottom:20px;width:60px;height:60px;border-radius:50%;border:1px solid rgba(184,138,50,.45);background:linear-gradient(135deg,#15100c,#6e4a18);color:#fff;font-size:24px;display:grid;place-items:center;z-index:9999;box-shadow:0 12px 35px rgba(0,0,0,.25);cursor:pointer}.hc-floating-cart .badge{position:absolute;right:-2px;top:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:#b88a32;color:#fff;font:700 11px Arial;display:grid;place-items:center}@media(max-width:560px){.hc-floating-cart{right:15px;bottom:15px;width:56px;height:56px}.view-offers-btn{width:min(88%,320px);justify-content:center}.btn-row{grid-template-columns:1fr}.btn-row .btn{min-width:0;width:100%}}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.nav{height:64px}.brand{font-size:18px}.hero{padding:88px 0 30px}.grid{grid-template-columns:1fr;padding-bottom:55px}.nav .wrap>div{gap:5px!important}.wa-top,.loc-top,.back{padding:9px 10px;font-size:11px}.wa-top{font-size:0}.wa-top:first-letter{font-size:15px}.loc-top{font-size:0}.loc-top:first-letter{font-size:15px}.back{font-size:11px}}
</style></head><body><header class="nav"><div class="wrap" style="display:flex;align-items:center;justify-content:space-between;width:min(1180px,92%)"><a class="brand" href="index.html">HARSHIYAAN COLLECTIONS</a><div style="display:flex;gap:8px;align-items:center"><a class="wa-top" href="https://wa.me/919703322305" target="_blank" rel="noopener">💬 WhatsApp</a><a class="loc-top" href="https://www.google.com/maps/search/?api=1&query=Harshiyaan%20Collection%2C%203%20Cross%2C%20SBI%20Colony%2C%20Madanapalle%2C%20Andhra%20Pradesh%20517325" target="_blank" rel="noopener">⌖ Location</a><a class="back" href="index.html">← Back</a></div></div></header><main class="wrap"><section class="hero"><div class="eyebrow">HARSHIYAAN COLLECTIONS</div><h1>Special Offers</h1><p>Current offers and featured deals managed from the Harshiyaan admin dashboard.</p><a class="view-offers-btn" href="index.html#offers">✨ Explore All Collections <span>→</span></a></section><section id="offerGrid" class="grid"></section></main><script>
function offerMoney(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function getOfferCart(){try{return JSON.parse(localStorage.getItem('hc_cart')||'[]')}catch(e){return []}}
function saveOfferCart(cart){localStorage.setItem('hc_cart',JSON.stringify(cart));updateOfferCartBadge()}
function updateOfferCartBadge(){var n=getOfferCart().reduce(function(a,x){return a+(Number(x.qty)||0)},0);var b=document.getElementById('offerCartBadge');if(b)b.textContent=n}
function addOfferToCart(id,button){
  var numericId=Number(id);
  var cart=getOfferCart();
  var item=cart.find(function(x){return Number(x.id)===numericId});
  if(item){item.qty=(Number(item.qty)||0)+1}else{cart.push({id:numericId,qty:1})}
  saveOfferCart(cart);
  if(button){button.innerHTML='✓ Added to Cart';button.disabled=true;setTimeout(function(){button.innerHTML='🛒 Add to Cart';button.disabled=false},1200)}
}
function openOfferCart(){
  sessionStorage.setItem('hc_open_cart','1');
  window.location.href='index.html#cart';
}
function renderOfferCards(){
  var products=[],offers=[];
  try{products=JSON.parse(localStorage.getItem('hc_products')||'[]');offers=JSON.parse(localStorage.getItem('hc_offers')||'[]')}catch(e){}
  var active=offers.filter(function(o){return o.active}).map(function(o){
    var p=products.find(function(x){return Number(x.id)===Number(o.productId)});
    return p?Object.assign({},p,{title:o.title,text:o.text,old:o.old||p.old,price:o.price||p.price}):null;
  }).filter(Boolean);
  var fallback=products.filter(function(p){return Number(p.old)>Number(p.price)});
  var list=active.length?active:fallback;
  var grid=document.getElementById('offerGrid');
  if(!list.length){grid.innerHTML='<div class="empty">No active offers right now. Please check again soon.</div>';return}
  grid.innerHTML=list.map(function(p){
    return '<article class="card"><img src="'+p.img+'" alt="'+p.name+'" onerror="this.onerror=null;this.src=\'products/product1.png\'"><div class="body"><h2>'+p.name+'</h2><div class="price"><s>'+offerMoney(p.old)+'</s><strong>'+offerMoney(p.price)+'</strong></div><div class="meta">Product ID: <b>'+p.id+'</b>'+(p.discount?' · '+p.discount+'% OFF':'')+'</div><p class="msg">'+(p.text||'Limited-time jewellery offer.')+'</p><div class="btn-row"><button class="btn gold" type="button" onclick="addOfferToCart(\''+p.id+'\',this)">🛒 Add to Cart</button></div></div></article>';
  }).join('');
}
document.addEventListener('DOMContentLoaded',function(){renderOfferCards();updateOfferCartBadge()});
</script><button type="button" class="hc-floating-cart" onclick="openOfferCart()" aria-label="Open shopping cart" title="Open Cart">🛒<span id="offerCartBadge" class="badge">0</span></button></body></html>
