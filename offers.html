<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Special Offers — Harshiyaan Collections</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>

n:1/-1}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.btn-row .btn{width:100%;min-height:46px;font-size:13px}.nav{height:64px}.brand{font-size:18px}.hero{padding:88px 0 30px}.grid{grid-template-columns:1fr;padding-bottom:55px}.nav .wrap>div{gap:5px!important}.wa-top,.loc-top,.back{padding:9px 10px;font-size:11px}.wa-top{font-size:0}.wa-top:first-letter{font-size:15px}.loc-top{font-size:0}.loc-top:first-letter{font-size:15px}.back{font-size:11px}}
</style></head><body><header class="nav"><div class="wrap" style="display:flex;align-items:center;justify-content:space-between;width:min(1180px,92%)"><a class="brand" href="index.html">HARSHIYAAN COLLECTIONS</a><div style="display:flex;gap:8px;align-items:center"><a class="wa-top" href="https://wa.me/919703322305" target="_blank" rel="noopener">💬 WhatsApp</a><a class="loc-top" href="https://www.google.com/maps/search/?api=1&query=Harshiyaan%20Collection%2C%203%20Cross%2C%20SBI%20Colony%2C%20Madanapalle%2C%20Andhra%20Pradesh%20517325" target="_blank" rel="noopener">⌖ Location</a><a class="back" href="index.html">← Back</a></div></div></header><main class="wrap"><section class="hero"><div class="eyebrow">HARSHIYAAN COLLECTIONS</div><h1>Special Offers</h1><p>Current offers and featured deals managed from the Harshiyaan admin dashboard.</p></section><section id="offerGrid" class="grid"></section></main><script>
(function(){
  function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
  function getCart(){try{return JSON.parse(localStorage.getItem('hc_cart')||'[]')}catch(e){return []}}
  function addOfferToCart(id,button){
    try{
      let cart=getCart();
      const key=String(id);
      let item=cart.find(x=>String(x.id)===key);
      if(item){item.qty=(Number(item.qty)||0)+1}else{cart.push({id:id,qty:1})}
      localStorage.setItem('hc_cart',JSON.stringify(cart));
      button.innerHTML='✓ Added to Cart';
      button.classList.add('added');
      button.disabled=true;
      const count=cart.reduce((n,x)=>n+(Number(x.qty)||0),0);
      document.querySelectorAll('[data-cart-count]').forEach(el=>el.textContent=count);
      setTimeout(()=>{button.innerHTML='🛒 Add to Cart';button.classList.remove('added');button.disabled=false},1400);
    }catch(e){console.error(e);alert('Unable to add this product to cart. Please try again.');}
  }
  window.addOfferToCart=addOfferToCart;
  function render(){
    let products=[],offers=[];
    try{products=JSON.parse(localStorage.getItem('hc_products')||'[]');offers=JSON.parse(localStorage.getItem('hc_offers')||'[]')}catch(e){}
    const active=offers.filter(o=>o.active).map(o=>{const p=products.find(x=>Number(x.id)===Number(o.productId));return p?{...p,title:o.title,text:o.text,old:o.old||p.old,price:o.price||p.price,discount:o.discount||p.discount}:null}).filter(Boolean);
    const fallback=products.filter(p=>Number(p.old)>Number(p.price));
    const list=active.length?active:fallback;
    const grid=document.getElementById('offerGrid');
    grid.innerHTML=list.length?list.map(p=>{
      const discount=p.discount || (p.old&&p.price?Math.round((1-p.price/p.old)*100):0);
      return '<article class="card"><img src="'+p.img+'" alt="'+String(p.name).replace(/"/g,'&quot;')+'"><div class="body"><h2>'+p.name+'</h2><div class="price"><strong>'+money(p.price)+'</strong> <s>'+money(p.old)+'</s></div><div class="meta">Product ID: <b>'+p.id+'</b>'+(discount?' · '+discount+'% OFF':'')+'</div><p class="msg">'+(p.text||'Limited-time jewellery offer.')+'</p><div class="btn-row"><button class="btn gold" type="button" onclick="addOfferToCart('+JSON.stringify(String(p.id))+',this)">🛒 Add to Cart</button></div></div></article>'
    }).join(''):'<div class="empty">No active offers right now. Please check again soon.</div>';
  }
  render();
})();
</script></body></html>
