ity:1}#offerToast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#241b26;color:#fff;padding:13px 18px;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.25s;z-index:9999;font-size:13px}#offerToast.show{opacity:1;transform:translate(-50%,0)}.empty{padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.nav{height:64px}.brand{font-size:18px}.hero{padding:88px 0 30px}.grid{grid-template-columns:1fr;padding-bottom:55px}.nav .wrap>div{gap:5px!important}.wa-top,.loc-top,.back{padding:9px 10px;font-size:11px}.wa-top{font-size:0}.wa-top:first-letter{font-size:15px}.loc-top{font-size:0}.loc-top:first-letter{font-size:15px}.back{font-size:11px}}

</style></head><body><header class="nav"><div class="wrap" style="display:flex;align-items:center;justify-content:space-between;width:min(1180px,92%)"><a class="brand" href="index.html">HARSHIYAAN COLLECTIONS</a><div style="display:flex;gap:8px;align-items:center"><a class="wa-top" href="https://wa.me/919703322305" target="_blank" rel="noopener">💬 WhatsApp</a><a class="loc-top" href="https://www.google.com/maps/search/?api=1&query=Harshiyaan%20Collection%2C%203%20Cross%2C%20SBI%20Colony%2C%20Madanapalle%2C%20Andhra%20Pradesh%20517325" target="_blank" rel="noopener">⌖ Location</a><a class="back" href="index.html">← Back</a></div></div></header><main class="wrap"><section class="hero"><div class="eyebrow">HARSHIYAAN COLLECTIONS</div><h1>Special Offers</h1><p>Current offers and featured deals managed from the Harshiyaan admin dashboard.</p></section><section id="offerGrid" class="grid"></section></main><script>
(function(){
  function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
  function getCart(){try{return JSON.parse(localStorage.getItem('hc_cart')||'[]')}catch(e){return []}}
  function saveCart(cart){localStorage.setItem('hc_cart',JSON.stringify(cart))}
  function addOfferToCart(id,button){
    const products=JSON.parse(localStorage.getItem('hc_products')||'[]');
    const p=products.find(x=>String(x.id)===String(id));
    if(!p){showToast('Product is unavailable');return}
    const cart=getCart();
    const item=cart.find(x=>String(x.id)===String(id));
    if(item){item.qty=(Number(item.qty)||0)+1}else{cart.push({id:p.id,qty:1})}
    saveCart(cart);
    if(window.hcUpdateOfferCartBadge) window.hcUpdateOfferCartBadge();
    button.innerHTML='✓ Added to Cart';
    button.classList.add('added');
    button.disabled=true;
    showToast(p.name+' added to cart');
    setTimeout(()=>{button.innerHTML='🛒 Add to Cart';button.classList.remove('added');button.disabled=false},1600);
  }
  function showToast(msg){
    let t=document.getElementById('offerToast');
    if(!t){t=document.createElement('div');t.id='offerToast';document.body.appendChild(t)}
    t.textContent=msg;t.classList.add('show');clearTimeout(window.__offerToast);window.__offerToast=setTimeout(()=>t.classList.remove('show'),1800)
  }
  window.addOfferToCart=addOfferToCart;
  function render(){
    let products=[],offers=[];
    try{products=JSON.parse(localStorage.getItem('hc_products')||'[]');offers=JSON.parse(localStorage.getItem('hc_offers')||'[]')}catch(e){}
    const active=offers.filter(o=>o.active).map(o=>{const p=products.find(x=>Number(x.id)===Number(o.productId));return p?{...p,title:o.title,text:o.text,old:o.old||p.old,price:o.price||p.price}:null}).filter(Boolean);
    const fallback=products.filter(p=>Number(p.old)>Number(p.price));
    const list=active.length?active:fallback;
    const grid=document.getElementById('offerGrid');
    grid.innerHTML=list.length?list.map(p=>`<article class="card"><img src="${p.img}" alt="${p.name}"><div class="body"><h2>${p.name}</h2><div class="price"><s>${money(p.old)}</s><strong>${money(p.price)}</strong></div><div class="meta">Product ID: <b>${p.id}</b>${p.discount?' · '+p.discount+'% OFF':''}</div><p class="msg">${p.text||'Limited-time jewellery offer.'}</p><div class="btn-row"><button class="btn gold offer-cart-btn" type="button" data-offer-id="${p.id}">🛒 Add to Cart</button></div></div></article>`).join(''):'<div class="empty">No active offers right now. Please check again soon.</div>';
    grid.querySelectorAll('.offer-cart-btn').forEach(btn=>btn.addEventListener('click',()=>addOfferToCart(btn.dataset.offerId,btn)));
  }
  render();
})();
</script>
<nav class="hc-bottom-nav" aria-label="Primary mobile navigation">
  <a href="index.html#home" aria-label="Home"><span class="hc-nav-icon">⌂</span><span class="hc-nav-label">Home</span></a>
  <a href="index.html#track" aria-label="Track Order"><span class="hc-nav-icon">⌖</span><span class="hc-nav-label">Track</span></a>
  <a href="index.html#cart" class="hc-nav-cart" aria-label="Open Cart"><span class="hc-nav-icon">🛒</span><span id="hcBottomCartBadge" class="hc-nav-badge">0</span><span class="hc-nav-label">Cart</span></a>
</nav>

<script id="hc-offers-cart-sync">
(function(){
  function update(){
    var cart=[];try{cart=JSON.parse(localStorage.getItem('hc_cart')||'[]')}catch(e){}
    var n=cart.reduce(function(a,x){return a+(Number(x.qty)||0)},0);
    var b=document.getElementById('hcBottomCartBadge');if(b)b.textContent=n;
  }
  window.hcUpdateOfferCartBadge=update;
  update();window.addEventListener('storage',update);setInterval(update,800);
})();
</script>
